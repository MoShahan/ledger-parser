name: Frontend lint - ESLint, Prettier, TypeScript

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-lint:
    name: ESLint, Prettier, TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint:frontend
      - run: npx prettier --check frontend
      - run: npm run typecheck
